<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="250" cy="250" r="212" />
    </clipPath>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="228" fill="none" stroke="#a39e9e" stroke-width="26" />
  
  <!-- White Background inside Ring -->
  <circle cx="250" cy="250" r="212" fill="#FFFFFF" />

  <!-- Buildings inside Circle Clip -->
  <g clip-path="url(#circle-clip)">
    <!-- Ground Base -->
    <rect x="0" y="398" width="500" height="110" fill="#a8a3a3" />

    <!-- 1. Leftmost short building -->
    <polygon points="70,270 98,255 98,398 70,398" fill="#5a6569" />
    <polygon points="98,255 136,275 136,398 98,398" fill="#9aa0a3" />

    <!-- 2. Mid-left tall building -->
    <polygon points="136,180 188,148 188,398 136,398" fill="#5a6569" />
    <polygon points="188,148 238,175 238,398 188,398" fill="#9aa0a3" />

    <!-- 3. Front middle overlapping building -->
    <polygon points="188,235 226,220 226,398 188,398" fill="#b0b3b5" />
    <polygon points="226,220 306,268 306,398 226,398" fill="#5a6569" />

    <!-- 4. Center-tallest building -->
    <polygon points="250,80 306,50 306,398 250,398" fill="#9aa0a3" />
    <polygon points="306,50 362,80 362,398 306,398" fill="#5a6569" />

    <!-- 5. Far right building -->
    <polygon points="362,175 392,160 392,398 362,398" fill="#5a6569" />
    <polygon points="392,160 422,180 422,398 392,398" fill="#b0b3b5" />
  </g>
</svg>
